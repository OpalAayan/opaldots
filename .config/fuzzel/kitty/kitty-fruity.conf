# nvim ~/.config/kitty/kitty-fruity.conf

#KITTY_SHELL_INTEGRATION fish
# fish
shell /usr/bin/fish
# ---------------------------------------------------------
# WINDOW & LAYOUT
# ---------------------------------------------------------
initial_window_width  110c
initial_window_height 25c
hide_window_decorations yes
window_padding_width 8 8 0 8 
remember_window_size  no
confirm_os_window_close 0

# ---------------------------------------------------------
# FONT SETTINGS
# ---------------------------------------------------------
font_family FiraCode Nerd Font
bold_font        auto
italic_font      auto
font_size        13.0

# ---------------------------------------------------------
# PERFORMANCE & BEHAVIOR
# ---------------------------------------------------------
enable_audio_bell no 
scrollback_lines 300000 
repaint_delay     10
input_delay       3
sync_to_monitor   yes

# ---------------------------------------------------------
# TAB BAR
# ---------------------------------------------------------
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style round
tab_title_max_length 7

# Active Colors (Watermelon accent)
active_tab_foreground   #0D080D
active_tab_background   #ff897d
active_tab_font_style   bold

# Inactive Colors
inactive_tab_foreground #ffffff
inactive_tab_background #261B26
inactive_tab_font_style normal

# Bar bg
tab_bar_background      #0D080D

# ---------------------------------------------------------
# CURSOR
# ---------------------------------------------------------
cursor_shape underline
cursor_trail 1
shell_integration no-cursor
cursor_stop_blinking_after 0
# Watermelon cursor for a pop of color
cursor #ff897d  
cursor_text_color #0D080D

# ---------------------------------------------------------
# THEME: DEEP FRUITY (Opaque)
# ---------------------------------------------------------
# Fully opaque background
background_opacity 1.0

# Deep, rich blackberry background
background #0D080D
# Pure white text for high contrast
foreground #ffffff

selection_foreground #0D080D
selection_background #ffd0b5

# Normal colors
color0  #261B26  # Black   (Deep Fig)
color1  #ff897d  # Red     (Watermelon)
color2  #9bd671  # Green   (Kiwi)
color3  #e0c754  # Yellow  (Pineapple)
color4  #76b1fb  # Blue    (Blueberry)
color5  #e495f8  # Magenta (Dragonfruit)
color6  #6cdad1  # Cyan    (Mint)
color7  #fbe6df  # White   (Lychee)

# Bright colors
color8  #3D2A3D  # Bright Black
color9  #ffaaa3  # Bright Red
color10 #b4e391  # Bright Green
color11 #eade82  # Bright Yellow
color12 #a1caff  # Bright Blue
color13 #f0b8ff  # Bright Magenta
color14 #94e7e1  # Bright Cyan
color15 #ffffff  # Bright White

# ---------------------------------------------------------
# KEY BINDINGS
# ---------------------------------------------------------
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+f toggle_fullscreen
map ctrl+shift+w close_window

# Custom no-shift font sizing
map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0     change_font_size all 0
