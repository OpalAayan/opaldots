windowrule = match:class ^(org.gnome.Characters)$, size 800 500
windowrule = match:class ^(org.gnome.Characters)$, center on



#*================================================================*#
#                           BORDER COLORS                          #
#*================================================================*#

# Syntax Reference: 
# windowrule = border_color [ACTIVE_COLOR] [INACTIVE_COLOR], match:class ^(classname)$
# Note: For gradients, the syntax is: color1 color2 ... angle color1 color2 ... angle

# --- Alacritty ---
# Active: Bright Orange | Inactive: Burnt/Off-Orange
windowrule = border_color rgba(ff9900ff) rgb(995c00), match:class ^Alacritty$

# --- Kitty ---
# Active: Light Pink/Purple | Inactive: Teal/Blue-ish
windowrule = border_color rgb(F7AFFF) rgb(8FBCBB), match:class ^kitty$

# --- Ghostty ---
# Active: Cyan | Inactive: Blue
windowrule = border_color rgb(9d7cd8) rgb(5a5f7a), match:class ^com\.mitchellh\.ghostty$

# --- Brave Browser ---
# Active: Purple | Inactive: Dim Light Pink
windowrule = border_color rgb(9d7cd8) rgb(eab8d1), match:class ^brave-browser$

# --- Firefox ---
#windowrule = match:class ^(firefox)$, border_color rgba(4c1d95ff) rgba(4c1d95ff) rgba(a78bfaff) rgba(f472b6ff) rgba(a78bfaff) 45deg rgba(4c1d95ff) rgba(a78bfaff) rgba(f472b6ff) rgba(a78bfaff) 45deg
windowrule = border_color rgba(a78bfaff) rgb(dcadf0), match:class ^(firefox)$

# --- Btop (Floating) ---
# Gradient Active: Purple/Pink/Red (180deg) | Gradient Inactive: Darker Purple/Red (180deg)
windowrule = border_color rgba(7c3aedff) rgba(cba6f7ff) rgba(b4befeff) rgba(d20f39ff) 180deg rgba(9333eaff) rgba(cba6f7ff) rgba(b4befeff) rgba(c01c28ff) 180deg, match:class ^btop-floating$

# --- Nmtui (Floating) --- 
windowrule = match:class ^(nmtui-floating)$, border_color rgba(4c1d95ff) rgba(4c1d95ff) rgba(a78bfaff) rgba(f472b6ff) rgba(a78bfaff) 180deg rgba(4c1d95ff) rgba(a78bfaff) rgba(f472b6ff) rgba(a78bfaff) 180deg

#*===================================*#
#           BlueJ IDE Shits           #
#*===================================*#

windowrule {
  name = unblur-bluej-menus
  match:class = ^(bluej\.Boot\$App)$
  match:float = true

  no_blur = on
}


