# Snappy Keys Configuration
# Lines starting with # or ; are comments

[Settings]
# Layout mode: "ticker" (horizontal) or "stack" (vertical)
layout = ticker

# Anchor position: bottom-right, bottom-center, top-right, top-left
anchor = bottom-right

# Bubble timeout in milliseconds (100–10000)
# Keys typed within this window are grouped into the same bubble
timeout_ms = 700

# Font size in points (6–72)
font_size = 16

# Fade animation framerate (1–144)
fade_fps = 45

# Space bar behavior:
#   badge   — Space is a word delimiter (creates a separate "Space" bubble)
#   literal — Space appends " " to the current bubble (sentence mode)
space_mode = badge

[Overrides]
# Remap raw XKB key names to custom display strings.
# Format: RawKeyName = DisplayName
#
# Core fallbacks are loaded automatically (Return=Enter, BackSpace=Bksp, etc.)
# Entries here overwrite or extend the built-in table.

Super_L = 
Super_R = ⌘
BackSpace = 󰁭
Return = ⏎
space = 󱁐
Escape = ESC
Tab = 
Caps_Lock = 󰘲
Alt_L = 󰘵
Up = 
Down = 
Left = 
Right = 

#[Colors]
# Inline colors override the active theme.
# Format: #RRGGBBAA
# bg_color = #26262ED1
# accent_color = #8C8CD9FF
# Theme: Catppuccin Mocha
# Soothing pastel theme for the high-spirited!

[Colors]
bg_color = #1E1E2ED1
text_color = #CDD6F4FF
accent_color = #CBA6F7FF
border_color = #31324499
badge_color = #F38BA8FF
badge_text_color = #11111BFF
hold_badge_color = #89B4FAFF
