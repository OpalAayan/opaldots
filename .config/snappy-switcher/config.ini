[general]
mode = context
follow_monitor = true
show_workspace_badge = true
sticky_mode = false
ignore_pinned = true
ignore_special = false
# mouse_support = true

[theme]
name = stormlight.ini
border_width = 1
card_border_width = 2
corner_radius = 15
[layout]
card_width = 145
card_height = 135
card_gap = 10
padding = 10
max_cols = 6
icon_size = 57
icon_radius = 15       
error_font_size = 11  
[icons]
theme = Tela-dracula
fallback = Tela-dracula
show_letter_fallback = true
[custom_icons]
kitty-fruity = ~/Downloads/jirachi.svg
btop-floating = ~/.local/share/icons/Tela-dracula/scalable/apps/btop.svg
[font]
family = FiraCode Nerd Font
weight = Bold
title_size = 10
icon_letter_size = 24


