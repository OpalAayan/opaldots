# Don't print a new line at the start of the prompt
add_newline = false

format = """
$cmd_duration $directory$git_branch
  $character"""

[fill]
symbol = '-'
style = 'fg:#3D2418'

[character]
success_symbol = "[ ](bold fg:#FF7F3E)"
error_symbol = "[ ](bold fg:#E05338)"

[package]
disabled = true

[git_branch]
style = "bg:#FF7F3E"
symbol = "󰘬"
truncation_length = 12
truncation_symbol = ""
format = " 󰜥 [](bold fg:#FF7F3E)[$symbol $branch(:$remote_branch)](fg:#0D080D bg:#FF7F3E)[ ](bold fg:#FF7F3E)"

[git_commit]
commit_hash_length = 4
tag_symbol = " "

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '
cherry_pick = "[󰞋 PICKING](bold fg:#E05338)"

[git_status]
conflicted = " 󰞇 "
ahead = " 󰁝 "
behind = " 󰁅 "
diverged = " 󰹹 "
untracked = " 󰋗 "
stashed = " 󰏖 "
modified = " 󰏫 "
staged = '[++\($count\)](green)'
renamed = " 󰑕 "
deleted = " 󰆴 "

[hostname]
ssh_only = false
format = "[•$hostname](bg:#FF7F3E bold fg:#0D080D)[](bold fg:#FF7F3E)"
trim_at = ".companyname.com"
disabled = false

[line_break]
disabled = false

[memory_usage]
disabled = true
threshold = -1
symbol = " "
style = "bold dimmed green"

[time]
disabled = true
format = '󰥔 [\[ $time \]]($style) '
time_format = "%T"

[username]
style_user = "bold bg:#FF7F3E fg:#0D080D"
style_root = "red bold"
format = "[](bold fg:#FF7F3E)[$user]($style)"
disabled = false
show_always = true

[directory]
home_symbol = " "
read_only = "  "
style = "bg:#E86A2E fg:#0D080D"
truncation_length = 0
truncate_to_repo = false
truncation_symbol = ".../"
# Removed colliding arrow glyph to prevent icon crowding with home_symbol
format = '[](bold fg:#E86A2E)[󰉋  $path]($style)[](bold fg:#E86A2E)'

[directory.substitutions]
"Desktop" = "  "
"Documents" = "  "
"Downloads" = "  "
"Music" = " 󰎈 "
"Pictures" = "  "
"Videos" = "  "
"GitHub" = " 󰊤 "

[cmd_duration]
min_time = 0
# Replaced mustard yellow with bright warm tangerine
format = '[](bold fg:#FFA04D)[󰪢 $duration](bg:#FFA04D fg:#0D080D)[](bold fg:#FFA04D)'
